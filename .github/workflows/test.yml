# Reusable test job: vet, race-enabled tests, lint and vulnerability check.
# Called by ci.yml for pull requests and by release.yml for pushes to main.
name: test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y multimon-ng
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          # Built with the project's Go toolchain, so a linter binary built
          # with an older Go never refuses the module.
          install-mode: goinstall
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
