version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
# The vendored C sources (third_party/libusb, librtlsdr, multimon-ng) are
# not covered; see the README in each directory for the update procedure.
